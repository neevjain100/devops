

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employee Data</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { margin-bottom: 20px; }
    label { display: block; margin: 8px 0 4px; }
    input { padding: 6px; width: 250px; }
    button { margin-top: 10px; padding: 6px 12px; }
    table { border-collapse: collapse; margin-top: 20px; width: 100%; max-width: 600px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
  </style>
</head>
<body>

  <h1>Employee Data Form</h1>

  <form id="employeeForm">
    <label for="empId">Employee ID</label>
    <input type="text" id="empId" required />

    <label for="empName">Name</label>
    <input type="text" id="empName" required />

    <label for="empDept">Department</label>
    <input type="text" id="empDept" required />

    <label for="empEmail">Email</label>
    <input type="email" id="empEmail" required />

    <button type="submit">Add Employee</button>
  </form>

  <h2>Stored Employees</h2>
  <table id="employeeTable">
    <thead>
      <tr>
        <th>Employee ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be added here -->
    </tbody>
  </table>

  <script>
    const form = document.getElementById('employeeForm');
    const tableBody = document.querySelector('#employeeTable tbody');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const id = document.getElementById('empId').value.trim();
      const name = document.getElementById('empName').value.trim();
      const dept = document.getElementById('empDept').value.trim();
      const email = document.getElementById('empEmail').value.trim();

      if (!id || !name || !dept || !email) return;

      const row = document.createElement('tr');

      [id, name, dept, email].forEach(text => {
        const cell = document.createElement('td');
        cell.textContent = text;
        row.appendChild(cell);
      });

      tableBody.appendChild(row);
      form.reset();
    });
  </script>

</body>
</html>
